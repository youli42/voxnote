<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxNote 配对</title>
<style>
  body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;
       display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:24px;max-width:340px}
  h1{font-size:16px;margin:0 0 12px}
  code{background:#000;padding:2px 6px;border-radius:4px;word-break:break-all}
  button{background:#2d6;color:#04280f;border:0;border-radius:8px;padding:10px 18px;
         font-size:14px;font-weight:600;margin:16px 0 8px;cursor:pointer}
  p{font-size:12.5px;color:#9a9a9a;line-height:1.6}
</style>
</head>
<body>
<!-- 扫码配对中转页：相机扫的都是 http 链接（兼容性最好）；
     打开后自动跳 voxnote:// deep link，由 VoxNote App 接管填入。 -->
<div class="card">
  <h1>VoxNote 服务器配对</h1>
  <p id="info">解析配对参数…</p>
  <button id="go" style="display:none">打开 VoxNote 完成配对</button>
  <p id="manual" style="display:none">没有自动跳转？打开 VoxNote →
    设置 → 服务器同步，手动填入上面的地址和令牌。</p>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var host=q.get('host')||'', t=q.get('t')||'';
  if(!host||!t){
    document.getElementById('info').textContent='配对参数缺失，请重新扫码。';
    return;
  }
  document.getElementById('info').innerHTML=
    '服务器地址<br><code>http://'+host.replace(/</g,'&lt;')+'</code><br><br>'+
    '令牌 / 连接密码<br><code>'+t.replace(/</g,'&lt;')+'</code>';
  var url='voxnote://pair?host='+encodeURIComponent(host)+'&t='+encodeURIComponent(t);
  var btn=document.getElementById('go');
  btn.style.display='';
  btn.onclick=function(){ location.href=url; };
  /* App 已装时自动跳；没装时 1.2s 后页面还在，亮出手动填写指引 */
  setTimeout(function(){
    if(!document.hidden) document.getElementById('manual').style.display='';
  },1200);
  location.href=url;
})();
</script>
</body>
</html>
