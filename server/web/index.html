<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voxnote · server</title>
<style>
  :root{
    --bg:#0b0c0f; --side:#0e0f13; --card:#14161b; --raise:#191c23; --line:#23262e; --line2:#2c303a;
    --text:#e7e9ee; --sub:#a7adba; --dim:#767c8a;
    --accent:#7b6cf6; --accent-h:#8d80ff; --accent-dim:#262243;
    --ok:#5cb98c; --warn:#d9a03c; --err:#e06c75; --info:#6ea8ff;
    --s1:#6ea8ff; --s2:#e0a458; --s3:#67c293; --s4:#c78fe0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-size:13px;overflow:hidden;
       font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#262a33;border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  .app{display:grid;grid-template-columns:208px 1fr;height:100vh;transition:grid-template-columns .12s}
  .app.collapsed{grid-template-columns:54px 1fr}
  .app.collapsed .bn,.app.collapsed .bs,.app.collapsed .navi .tx,.app.collapsed .navi .cnt,
  .app.collapsed .syncbox,.app.collapsed .foldhint{display:none}
  .app.collapsed .navi{justify-content:center;padding:9px 0}
  .app.collapsed .brand{justify-content:center;padding-left:0;padding-right:0}
  .app.collapsed #btnFold{margin:0 auto}

  /* 侧栏 */
  .side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 12px}
  .brand{display:flex;gap:10px;align-items:center;padding:2px 8px 14px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;font-size:17px;font-weight:800;
        display:flex;align-items:center;justify-content:center;flex:none}
  .bn{font-size:14.5px;font-weight:700;letter-spacing:.2px}
  .bs{font-size:9.5px;color:var(--dim);letter-spacing:2.5px;margin-top:2px}
  .navi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;border:0;background:none;
        color:var(--sub);font-size:12.5px;cursor:pointer;text-align:left;margin-bottom:2px}
  .navi svg{flex:none;opacity:.75}
  .navi:hover{background:#161922;color:var(--text)}
  .navi.on{background:var(--accent-dim);color:#cfc9ff}
  .navi.on svg{opacity:1}
  .navi .cnt{margin-left:auto;background:#2a2f3c;color:var(--sub);font-size:10px;border-radius:999px;padding:1px 7px}
  .navi.on .cnt{background:#3a3565;color:#c4bcff}
  .side .gap{flex:1}
  .syncbox{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 11px;margin:0 2px}
  .syncbox .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub)}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--ok);flex:none}
  .syncbox .t{color:var(--dim);font-size:10.5px;margin-top:5px;line-height:1.6}
  .syncbox .btn-s{margin-top:8px;width:100%;background:var(--raise);border:1px solid var(--line2);color:var(--sub);
        border-radius:8px;padding:6px 0;font-size:11.5px;cursor:pointer}
  .syncbox .btn-s:hover{color:var(--text);border-color:#3a4050}

  /* 顶栏 */
  .main{display:flex;flex-direction:column;min-width:0}
  .top{height:52px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px}
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;
          padding:7px 12px;width:340px;color:var(--dim)}
  .search input{background:none;border:0;outline:0;color:var(--text);font-size:12.5px;width:100%;font-family:inherit}
  .search input::placeholder{color:var(--dim)}
  .top .grow{flex:1}
  .btn{background:var(--raise);border:1px solid var(--line2);color:var(--sub);font-size:12px;border-radius:9px;
       padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:hover{color:var(--text);border-color:#3a4050}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.accent:hover{background:var(--accent-h)}
  .btn.sm{padding:5px 10px;font-size:11.5px;border-radius:8px}
  .btn.ghost{background:none;border-color:transparent}
  .btn.ghost:hover{background:var(--card)}
  /* ghost 按钮的开启态（跳过静音）：描边 + 淡紫底，明确区别于未开启 */
  .btn.ghost.accent{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-h)}
  .btn.ghost.accent:hover{border-color:var(--accent-h);color:#fff}
  .btn.danger{color:var(--err)}
  .btn[disabled]{opacity:.5;cursor:default}
  /* 按下反馈：可点按钮轻微缩放 */
  .btn:active{transform:scale(.94)}
  .op:active{transform:scale(.9)}
  .pbtn:active{transform:scale(.92)}
  .avatar{width:30px;height:30px;border-radius:99px;background:#2a2f3c;color:var(--sub);font-size:12px;font-weight:700;
          display:flex;align-items:center;justify-content:center;cursor:pointer}

  .pages{flex:1;min-height:0;position:relative}
  .page{display:none;position:absolute;inset:0;overflow-y:auto;padding:20px 22px 40px}
  .page.on{display:block}
  .ph{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .ph h1{font-size:17px;font-weight:650}
  .ph .sub{font-size:11.5px;color:var(--dim)}

  /* 通用 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
  .card h3{font-size:12.5px;font-weight:650;margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .card h3 .more{margin-left:auto;font-size:11px;color:var(--dim);cursor:pointer;font-weight:400}
  .card h3 .more:hover{color:var(--text)}
  .st{font-size:10px;border-radius:6px;padding:2px 7px;border:1px solid;white-space:nowrap}
  .st.done{color:#9fc6ae;border-color:#33473c}
  .st.queued{color:#a8b4c8;border-color:#39414f}
  .st.asr{color:#e0c684;border-color:#574a2b}
  .st.fail{color:#e8949b;border-color:#58383e}
  .st.raw{color:#a8b4c8;border-color:#39414f}
  .st.ed{color:#b9aef5;border-color:#413b66}
  /* 默认标题的相对日标记（今天/昨天/前天/一周内…） */
  .st.rel{color:#9db4d8;border-color:#39445c}

  .toggle{width:34px;height:19px;border-radius:99px;background:#2a2e39;border:1px solid var(--line2);position:relative;
          cursor:pointer;flex:none;transition:.15s}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:99px;background:#8a90a0;transition:.15s}
  .toggle.on{background:var(--accent);border-color:var(--accent)}
  .toggle.on::after{left:16px;background:#fff}

  select,input[type=text],input[type=password]{background:var(--card);border:1px solid var(--line2);color:var(--text);
       border-radius:8px;padding:7px 10px;font-size:12px;outline:0;font-family:inherit}
  select:focus,input:focus{border-color:#4a4368}

  /* 工作台 */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;cursor:pointer;transition:border-color .12s}
  .tile:hover{border-color:#333a48}
  .tile .k{font-size:11px;color:var(--dim)}
  .tile .v{font-size:23px;font-weight:700;margin:7px 0 3px;letter-spacing:.3px}
  .tile .v small{font-size:11px;color:var(--dim);font-weight:400;margin-left:4px}
  .tile .d{font-size:10.5px;color:var(--dim)}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mini{display:grid;grid-template-columns:1fr;gap:10px}
  .qrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #1b1e25}
  .qrow:last-child{border-bottom:0}
  .qrow .nm{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .qrow .nm:hover{color:var(--accent-h)}
  .qrow .mt{font-size:10.5px;color:var(--dim);white-space:nowrap}
  .pbar{height:4px;background:#22252e;border-radius:99px;overflow:hidden;width:110px;flex:none}
  .pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
  .pnum{font-size:10.5px;color:var(--sub);width:34px;text-align:right;flex:none}
  .act{display:flex;gap:9px;align-items:flex-start;padding:7px 2px;border-bottom:1px solid #1b1e25;font-size:11.5px}
  .act:last-child{border-bottom:0}
  .act .tm{color:var(--dim);font-size:10.5px;white-space:nowrap;padding-top:1px}
  .act .bd{color:var(--sub);min-width:0;cursor:pointer}
  .act .bd:hover{color:var(--text)}
  .act .bd b{color:var(--text);font-weight:600}

  /* 记录库：列表列限宽、详情列必须可收缩（minmax(0,…)），否则窄视口被波形条撑爆 */
  .lib{display:grid;grid-template-columns:minmax(220px,var(--libw,318px)) 4px minmax(0,1fr);gap:0;height:100%;margin:-20px -22px -40px}
  .vsplit{cursor:col-resize;background:transparent}
  .vsplit:hover{background:var(--accent-dim)}
  .pager{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .pager button{background:var(--card);border:1px solid var(--line2);color:var(--sub);border-radius:7px;
    padding:4px 10px;cursor:pointer;font-size:11px;font-family:inherit}
  .pager button:hover{color:var(--text)}
  .pager button[disabled]{opacity:.4;cursor:default}
  .pager .cur{color:var(--accent-h)}
  .liblist{border-right:1px solid var(--line);padding:16px 14px 30px;overflow-y:auto}
  .liblist .search{width:100%;margin-bottom:10px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  .chip{border:1px solid var(--line2);color:var(--sub);font-size:11px;border-radius:999px;padding:4px 11px;
        cursor:pointer;background:var(--card)}
  .chip:hover{color:var(--text)}
  .chip.on{background:var(--accent-dim);border-color:#4a4376;color:#cfc9ff}
  .ritem{border:1px solid transparent;border-radius:11px;padding:10px 11px;cursor:pointer;margin-bottom:4px}
  .ritem:hover{background:var(--card)}
  .ritem.on{background:var(--card);border-color:#413b66}
  .ritem .t{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .ritem .t .st{margin-left:auto;transform:scale(.9)}
  .ritem .m{font-size:10.5px;color:var(--dim);margin-top:5px;display:flex;gap:8px;align-items:center}
  /* 上传设备标签：这条音频是从哪台设备同步上来的 */
  .dev{font-size:9.5px;border-radius:6px;padding:1px 6px;border:1px solid #35507a;color:#9db4d8;white-space:nowrap}
  .ritem .pv{font-size:10.5px;color:var(--sub);margin-top:4px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  /* 批量归类 */
  .batchbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px dashed #413b66;border-radius:10px;
    padding:8px 10px;margin-bottom:8px;font-size:11.5px;color:var(--sub)}
  .batchbar select{background:var(--raise);border:1px solid var(--line2);color:var(--text);border-radius:7px;
    font-size:11.5px;padding:4px 8px;max-width:180px}
  .ritem .pickbox{width:14px;flex:none;color:var(--dim)}
  .ritem.picked{background:var(--accent-dim);border-color:#4a4376}
  .dlrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .hintblk{font-size:10.5px;color:var(--dim);line-height:1.8;margin-top:9px}
  .hintblk a{color:var(--info);text-decoration:none}

  /* 录音流：平铺卡片 + 连播，批量 review 用。工具栏吸顶，翻看长列表时筛选随手可换。
     卡片紧凑：首行=播放钮+标题+元信息+操作，次行细进度条，正文 3 行钳制 */
  .sttop{position:sticky;top:0;z-index:20;background:var(--bg);margin:-20px -22px 0;
         padding:12px 22px 9px;border-bottom:1px solid var(--line)}
  .sthd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .sthd h1{font-size:17px;font-weight:650}
  .sthd .sub{font-size:11.5px;color:var(--dim)}
  .sthd .grow{flex:1}
  .sttop .search{width:100%;max-width:420px;margin:8px 0 0}
  .sttop .chips{margin-bottom:2px}
  .sttop .chips:last-child{margin-bottom:0}
  .sc{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 13px 8px;margin-bottom:7px}
  .sc.playing{border-color:#4a4376}
  .sc .hd{display:flex;align-items:center;gap:8px;min-width:0}
  .sc .pbtn{width:27px;height:27px;flex:none}
  .sc .tt{font-size:13px;font-weight:650;cursor:pointer;flex:0 1 auto;min-width:0;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap}
  .sc .tt:hover{color:var(--accent-h)}
  .sc .mt2{font-size:10.5px;color:var(--dim);white-space:nowrap;display:flex;gap:7px;align-items:center;flex:none}
  .sc .mt2 .st{transform:scale(.92)}
  .sc .grow{flex:1;min-width:8px}
  .sc .acts{display:flex;gap:4px;flex:none}
  .sc .acts .op{font-size:10px;padding:3px 8px}
  .sc .bar{height:4px;background:#22252e;border-radius:99px;margin-top:8px;cursor:pointer;overflow:hidden}
  .sc .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
  /* 流卡片波形：只在播放这张卡片时出现（.playing 才展开）省面板空间，
     暂停时保持显示，方便拖动调进度 */
  .sc .wave{display:none;flex:none;margin-top:8px}
  .sc.playing .wave{display:block}
  /* 默认收起 3 行；.open 时换回块级布局解除行数钳制（-webkit-box 的 clamp 即失效） */
  .sc .txt{font-size:12.5px;line-height:1.8;color:#ccd1da;margin-top:8px;overflow-wrap:anywhere;white-space:pre-wrap;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .sc .txt.dim{color:var(--dim)}
  .sc.open .txt{display:block}
  .sc .ft{display:flex;justify-content:flex-end;margin-top:5px}

  .libdetail{overflow-y:auto;overflow-x:hidden;padding:20px 26px 46px;min-width:0}
  .dt{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .dt h2{font-size:18px;font-weight:650;outline:0;border-radius:6px;padding:2px 5px;margin:-2px -5px;min-width:80px;
         overflow-wrap:anywhere}
  .dt h2:hover{background:var(--card)}
  .dt h2:focus{background:var(--raise);box-shadow:0 0 0 1px #413b66}
  .dt .acts{margin-left:auto;display:flex;gap:7px;flex:none}
  .dm{color:var(--dim);font-size:11px;margin:8px 0 14px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}

  .player{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
          display:flex;align-items:center;gap:13px;margin-bottom:14px;flex-wrap:wrap}
  .pbtn{width:38px;height:38px;border-radius:99px;background:var(--accent);border:0;color:#fff;cursor:pointer;
        display:flex;align-items:center;justify-content:center;flex:none}
  .pbtn:hover{background:var(--accent-h)}
  /* 波形容器（记录库播放器 + 流卡片共用）：内部由 WaveSurfer 逐像素绘制精确波形，
     静音段铺半透明压暗层，点击/拖拽 seek 交给 WS 自带交互 */
  .wave{flex:1;min-width:0;position:relative;height:44px;cursor:pointer;overflow:hidden}
  .wave .silov{position:absolute;top:0;bottom:0;background:rgba(10,11,15,.55);pointer-events:none}
  .ptime{font-size:11px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
  .pside{display:flex;gap:6px;flex:none}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:13px}
  .tab{background:none;border:0;color:var(--dim);font-size:12.5px;padding:8px 13px;cursor:pointer;
       border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}

  /* 转写版本页签：当前结果 + 历史存档，逐版本一块 */
  .veritem{margin-top:14px}
  .verhead{font-size:11px;color:var(--sub);display:flex;gap:10px;align-items:center;margin-bottom:5px;
    font-variant-numeric:tabular-nums}
  .vernum{border:1px solid #413b66;color:var(--accent-h);border-radius:5px;padding:1px 8px;font-size:9.5px}
  .vertext{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 13px;
    font-size:12px;line-height:1.8;color:#ccd1da;white-space:pre-wrap;overflow-wrap:anywhere}

  .segbar{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .segbar .auto{font-size:10.5px;color:var(--ok);display:flex;align-items:center;gap:5px}
  .segbar .grow{flex:1}
  .seg{display:flex;gap:10px;padding:7px 9px;border-radius:9px;align-items:flex-start}
  .seg:hover{background:var(--card)}
  .seg.ed{background:#16142366}
  .seg.hl{background:#23204a}
  .seg .ts{font-size:10px;color:var(--dim);padding-top:5px;width:44px;flex:none;cursor:pointer;font-variant-numeric:tabular-nums}
  .seg .ts:hover{color:var(--accent)}
  .seg .spk{flex:none;font-size:10.5px;border-radius:6px;padding:3px 8px;cursor:pointer;margin-top:1px;
            border:1px solid transparent;white-space:nowrap}
  .seg .tx{font-size:13px;line-height:1.75;color:#d7dae2;outline:0;border-radius:5px;padding:1px 4px;margin:-1px -4px;min-width:0}
  .seg .tx:hover{background:#1d2029}
  .seg .tx:focus{background:var(--raise);box-shadow:0 0 0 1px #4a4368;color:var(--text)}
  .seg .ops{margin-left:auto;display:none;gap:3px;flex:none;padding-top:2px}
  /* 转写中实时出稿区：复用 .seg 行样式，只读（转写完成前不开放修订，防机器层替换踩掉编辑） */
  .livesegs{max-height:320px;overflow-y:auto;margin-top:12px;text-align:left;border-top:1px solid var(--line);padding-top:8px}
  .livesegs .seg .spk,.livesegs .seg .tx{cursor:default}
  .livesegs .seg .tx:hover{background:none}
  /* 标签下拉菜单（详情页 chip） */
  .catmenu{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 10px 28px rgba(0,0,0,.5);padding:4px;min-width:150px;max-height:280px;overflow-y:auto}
  .catmenu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);
    font-size:12.5px;padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .catmenu button:hover{background:#242833}
  .catmenu button.on{color:var(--accent)}
  .catmenu button.new{color:var(--accent)}
  /* 失败详情展开 */
  .errmore{font-size:11.5px;color:var(--dim);cursor:pointer;margin-top:10px}
  .errmore:hover{color:var(--sub)}
  .errdetail{font-size:11px;line-height:1.6;color:var(--sub);background:#14161c;border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;margin:10px auto 0;max-width:560px;max-height:220px;overflow:auto;
    white-space:pre-wrap;word-break:break-all;text-align:left;font-family:Consolas,monospace}
  .fpath{font-size:11px;color:var(--dim);margin-top:3px;cursor:pointer}
  .fpath:hover{color:var(--sub)}
  .seg:hover .ops{display:flex}
  .op{background:var(--raise);border:1px solid var(--line2);color:var(--dim);font-size:10px;border-radius:6px;
      padding:3px 7px;cursor:pointer;white-space:nowrap}
  .op:hover{color:var(--text);border-color:#3a4050}
  .edmark{font-size:9.5px;color:#b9aef5;border:1px solid #413b66;border-radius:5px;padding:1px 6px;margin-top:4px;flex:none}
  .plain{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 20px;
         font-size:13px;line-height:1.9;color:#ccd1da;white-space:pre-wrap}
  .emptybox{color:var(--dim);font-size:12px;line-height:2;padding:30px 10px;text-align:center}

  /* 转写 */
  .drop{border:1.5px dashed #333a48;border-radius:13px;padding:22px;text-align:center;color:var(--dim);
        font-size:12px;margin-bottom:14px;cursor:pointer}
  .drop:hover{border-color:#4a4368;color:var(--sub)}
  .drop b{color:var(--sub);font-weight:600}
  .engs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .eng{border:1px solid var(--line);border-radius:13px;padding:13px 14px;cursor:pointer;background:var(--card)}
  .eng:hover{border-color:#333a48}
  .eng.on{border-color:var(--accent);background:#16142366}
  .eng.dis{opacity:.5}
  .eng .r1{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650}
  .eng .rdo{width:15px;height:15px;border-radius:99px;border:1.5px solid #3c4250;flex:none;position:relative}
  .eng.on .rdo{border-color:var(--accent)}
  .eng.on .rdo::after{content:'';position:absolute;inset:2.5px;border-radius:99px;background:var(--accent)}
  .eng .r2{font-size:11px;color:var(--sub);margin-top:7px;line-height:1.65}
  .eng .r3{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  table.qt{width:100%;border-collapse:collapse}
  table.qt th{font-size:10.5px;color:var(--dim);text-align:left;font-weight:500;padding:0 10px 9px}
  table.qt td{padding:10px;border-top:1px solid #1b1e25;font-size:12px;color:var(--sub);vertical-align:middle}
  table.qt td.nmw{color:var(--text);font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .errtxt{color:var(--err);font-size:11px}

  /* AI */
  .ai{display:grid;grid-template-columns:280px 1fr;gap:12px;height:100%;margin:-20px -22px -40px}
  .ctx{padding:16px 14px 30px;overflow-y:auto;border-right:1px solid var(--line)}
  .ctx h3{font-size:11px;color:var(--dim);font-weight:500;margin:14px 4px 8px;letter-spacing:.5px}
  .ctx .lim{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:12px;color:var(--sub)}
  .ctx .lim:hover{background:var(--card)}
  .ctx .lim.on{background:var(--card);color:var(--text)}
  .ctx .lim .n{margin-left:auto;color:var(--dim);font-size:10.5px}
  .chat{display:flex;flex-direction:column;min-width:0}
  .msgs{flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:16px}
  .msg{max-width:78%;font-size:13px;line-height:1.75}
  .msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px}
  .msg.a{align-self:flex-start}
  .msg.a .who{font-size:10.5px;color:var(--dim);margin-bottom:6px;display:flex;gap:7px;align-items:center}
  .msg.a .bd{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:13px 16px;color:#ccd1da;white-space:pre-wrap}
  .cite{display:inline-flex;align-items:center;background:#221f38;border:1px solid #3d3766;color:#b6adf5;
        border-radius:6px;padding:1px 7px;font-size:10.5px;cursor:pointer;margin:0 2px}
  .cite:hover{background:#2b2750;color:#d6d0ff}
  .composer{flex:none;border-top:1px solid var(--line);padding:13px 18px 15px;background:var(--side)}
  .qact{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .composer .row{display:flex;gap:9px;align-items:flex-end}
  .composer textarea{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:12px;color:var(--text);
        padding:11px 14px;font-size:13px;outline:0;resize:none;height:46px;font-family:inherit;line-height:1.5}
  .composer textarea:focus{border-color:#4a4368}
  .send{width:46px;height:46px;border-radius:12px;background:var(--accent);border:0;color:#fff;cursor:pointer;
        display:flex;align-items:center;justify-content:center;flex:none}
  .send:hover{background:var(--accent-h)}
  .send[disabled]{opacity:.5}
  .mdl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);white-space:nowrap}

  /* 设置 */
  .setgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:980px}
  .srow{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid #1b1e25}
  .sec{font-size:11px;font-weight:600;color:var(--sub);margin:13px 0 2px}
  .sec:hover{color:var(--text)}
  .srow:last-child{border-bottom:0}
  .srow .lb{font-size:12.5px;color:var(--text)}
  .srow .hint{font-size:10.5px;color:var(--dim);margin-top:3px}
  .srow .rt{margin-left:auto;display:flex;align-items:center;gap:9px}
  .tok{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--sub);background:var(--raise);
       border:1px solid var(--line2);border-radius:7px;padding:4px 9px}

  /* toast */
  #toast{position:fixed;right:18px;bottom:18px;background:#1d2029;border:1px solid var(--line2);color:var(--text);
         font-size:12px;border-radius:10px;padding:10px 14px;max-width:340px;display:none;z-index:99;box-shadow:0 6px 24px #0009}

  /* 详细信息弹窗 */

<script>
/* ================= 基础 ================= */
var API = '/api/v1';
/* 服务端设置了 VOXNOTE_API_KEY 时，首次 401 会提示输入并记在 localStorage */
function apiKey(){try{return localStorage.getItem('vn.key')||''}catch(e){return ''}}
function api(path, opt){
  opt = opt || {};
  if(opt.body && typeof opt.body!=='string' && !(opt.body instanceof FormData)){
    opt.headers = Object.assign({'Content-Type':'application/json'}, opt.headers||{});
    opt.body = JSON.stringify(opt.body);
  }
  if(apiKey()) opt.headers = Object.assign({'X-VoxNote-Key':apiKey()}, opt.headers||{});
  return fetch(API+path, opt).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(r.status===401 && j && j.detail==='需要 X-VoxNote-Key' && !opt._retried){
        var k=prompt('此服务已启用访问密钥（VOXNOTE_API_KEY），请输入：', apiKey());
        if(k!==null){try{localStorage.setItem('vn.key',k)}catch(e){}}
        return api(path, Object.assign({}, opt, {_retried:1}));
      }
      if(!r.ok){
        var d=j.detail;
        if(d&&d.push)d=d.map(function(x){return x.msg||JSON.stringify(x)}).join('；'); /* 422 校验错误是数组 */
        throw new Error(d || ('HTTP '+r.status));
      }
      return j;
    });
  });
}
function toast(s){
  var t=document.getElementById('toast');
  t.textContent=s; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(function(){t.style.display='none'},2600);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* 长路径掐头留尾显示（完整路径在 title/复制里） */
function fpathShort(p){p=String(p);return p.length>64?p.slice(0,28)+' … '+p.slice(-32):p;}
function fmtMs(ms){ms=Math.max(0,ms|0);var s=Math.floor(ms/1000);return (s/60|0)+':'+('0'+s%60).slice(-2);}
function fmtDur(ms){var s=Math.round(ms/1000),m=s/60|0;return (m<100?('0'+m).slice(-2):m)+':'+('0'+s%60).slice(-2);}
function fmtTime(ts){var d=new Date(ts);return (d.getMonth()+1)+'-'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function fmtFull(ts){if(!ts)return '–';var d=new Date(ts);
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+
  ' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);}
/* 完整日期时间（不含秒），默认标题的替代显示用 */
function fmtDT(ts){var d=new Date(ts);
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+
  ' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
/* 默认标题（安卓端生成的「录音 HH:MM」）在列表里换成完整日期时间 + 相对日标记，
   方便快速检查；用户自己起的标题原样显示。空标题同样按默认处理。 */
var DEFAULT_TITLE_RE=/^录音 \d{1,2}:\d{2}$/;
function isDefaultTitle(t){t=String(t||'').trim();return !t||DEFAULT_TITLE_RE.test(t);}
function relDay(ts){
  var midnight=function(x){return new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();};
  var n=Math.round((midnight(new Date())-midnight(new Date(ts)))/86400000);
  if(n<=0)return '今天';
  if(n===1)return '昨天';
  if(n===2)return '前天';
  if(n<=7)return '一周内';
  if(n<=14)return '一周前';
  if(n<=30)return '两周前';
  return '一月前';
}
function relChip(ts){return ' <span class="st rel">'+relDay(ts)+'</span>';}
function fmtBytes(b){if(b>1<<30)return (b/(1<<30)).toFixed(1)+' GB';if(b>1<<20)return (b/(1<<20)).toFixed(0)+' MB';return (b/1024|0)+' KB';}
var STMAP={done:['done','已转写'],queued:['queued','排队'],asr:['asr','转写中'],fail:['fail','失败'],raw:['raw','仅音频']};
function stChip(st){var m=STMAP[st]||STMAP.raw;return '<span class="st '+m[0]+'">'+m[1]+'</span>';}
/* 逐字实时出稿只对流式引擎开放；批量引擎（一次性返回整篇）显示提示 */
var STREAM_ENGINES={'whisper-local':1};
function engineName(id){var e=(engines||[]).filter(function(x){return x.id===id;})[0];return e?e.name:(id||'');}
var SPKC=['var(--s1)','var(--s2)','var(--s3)','var(--s4)'];
/* 流卡片播放/暂停图标：初始渲染、播放切换、停止归位三处共用，避免各写一份走样 */
var SVG_PLAY='<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
var SVG_PAUSE='<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
function spkName(s){return s>=0?'发言人 '+(s+1):'未标注';}

var cur='home';
/* ================= URL 路由（hash） =================
   #/home · #/lib · #/lib/<记录id> · #/asr · #/ai · #/set
   刷新 / 前进 / 后退都回到原页面与正在阅读的记录。
   静态目录以 html=True 挂在 / 下，真实路径刷新会 404，故用 hash。 */
var _navInternal=false;
function setHash(h){
  if(location.hash===h)return;
  _navInternal=true; /* 自己写的 hash 由 hashchange 里吞掉，不重复渲染 */
  location.hash=h;
}
function go(p,rid){
  cur=p;
  document.querySelectorAll('.navi').forEach(function(x){x.classList.toggle('on',x.dataset.p===p)});
  document.querySelectorAll('.page').forEach(function(x){x.classList.toggle('on',x.id==='p-'+p)});
  if(p==='home')loadStats();
  if(p==='lib')loadList();
  if(p==='stream')loadStream();
  if(p==='asr')loadAsr();
  if(p==='set')loadSettings();
  if(p==='ai')initAi();
  if(p==='lib')setHash('#/lib'+((rid||S.sel)?'/'+(rid||S.sel):''));
  else setHash('#/'+p);
}
function routeFromHash(){
  var parts=location.hash.replace(/^#\/?/,'').split('/');
  var p=document.getElementById('p-'+parts[0])?parts[0]:'home';
  var rid=p==='lib'&&parts[1]?parts[1]:null;
  if(rid&&rid!==S.sel){
    S.sel=rid;
    if(cur==='lib'){renderList();loadDetail(rid);return;} /* 已在记录库：只换选中记录 */
  }
  go(p);
}
window.addEventListener('hashchange',function(){
  if(_navInternal){_navInternal=false;return;}
  routeFromHash(); /* 浏览器前进/后退 */
});
document.querySelectorAll('.navi').forEach(function(n){n.onclick=function(){go(n.dataset.p)};});
document.querySelectorAll('[data-go]').forEach(function(el){el.onclick=function(){go(el.dataset.go)};});

var stats=null;
var lastRecCount=-1; /* 上次轮询到的记录总数，用于感知新内容（手机同步/他端上传/删除） */
function loadStats(){
  api('/stats').then(function(s){
    stats=s;
    document.getElementById('cntRecs').textContent=s.records;
    document.getElementById('cntJobs').textContent=(s.queue.queued+s.queue.running)||'';
    document.getElementById('homeSub').textContent='共 '+s.records+' 场 · '+s.total_hours+' 小时';
    document.getElementById('stToday').textContent=s.today;
    document.getElementById('stTotal').textContent='库内共 '+s.records+' 场';
    document.getElementById('stQueue').textContent=s.queue.queued+s.queue.running;
    document.getElementById('stQueueD').textContent=s.queue.running+' 进行中 · '+s.queue.queued+' 排队';
    document.getElementById('stEdited').textContent=s.edited;
    document.getElementById('stAudio').textContent=fmtBytes(s.audio_bytes);
    document.getElementById('stHours').textContent=s.total_hours+' 小时录音';
    document.getElementById('syncInfo').textContent='记录 '+s.records+' · 队列 '+(s.queue.queued+s.queue.running);
    document.getElementById('aiReadyTxt').innerHTML=s.ai_ready
      ?'已配置 · <span style="color:var(--ok)">可用</span>'
      :'<span style="color:var(--warn)">未配置 API Key</span> — 前往 设置 → AI';

    var j=document.getElementById('homeJobs');j.innerHTML='';
    if(!s.active_jobs.length)j.innerHTML='<div class="qrow"><span class="nm" style="color:var(--dim)">队列为空</span></div>';
    s.active_jobs.forEach(function(a){
      var row=document.createElement('div');row.className='qrow';
      var inner;
      if(a.state==='fail')inner='<span class="st fail">失败</span><button class="btn sm" data-retry>重试</button>';
      else if(a.state==='running')inner='<div class="pbar"><i style="width:'+(a.progress*100|0)+'%"></i></div><span class="pnum">'+(a.progress*100|0)+'%</span>';
      else inner='<span class="st queued">排队</span>';
      row.innerHTML='<span class="nm" data-open>'+esc(a.title||a.record_id)+'</span>'+inner;
      row.querySelector('[data-open]').onclick=function(){openRecord(a.record_id);};
      var rb=row.querySelector('[data-retry]');
      if(rb)rb.onclick=function(){api('/jobs/'+a.id+'/retry',{method:'POST'}).then(function(){loadStats();toast('已重新入队');}).catch(function(e){toast(e.message)});};
      j.appendChild(row);
    });
    var r=document.getElementById('homeRecent');r.innerHTML='';
    s.recent.forEach(function(x){
      var d=document.createElement('div');d.className='act';
      d.innerHTML='<span class="tm">'+fmtTime(x.created_at)+'</span><div class="bd"><b>'+esc(x.title||x.id)+'</b> '+STMAP[(x.status=='queued')?'queued':x.status][1]+'</div>';
      d.querySelector('.bd').onclick=function(){openRecord(x.id);};
      r.appendChild(d);
    });
    if(cur==='ai')document.getElementById('ctxAll').textContent=s.records+' 场';

    /* 新内容自动刷新：总数变化说明有记录进/出（手机同步、他端上传或删除）。
       在记录库页就地形刷新列表；其他页给个提示，切过去时 go('lib') 本来就会重拉。 */
    if(lastRecCount>=0&&s.records!==lastRecCount){
      if(cur==='lib')loadList();
      if(cur==='stream')loadStream();
      if(s.records>lastRecCount)toast('新增 '+(s.records-lastRecCount)+' 条记录');
    }
    lastRecCount=s.records;

    syncTrans();
    syncStreamJobs();
  }).catch(function(e){toast('统计加载失败：'+e.message);});
}
function jobFor(id){
  var j=null;(stats&&stats.active_jobs||[]).forEach(function(a){if(a.record_id===id)j=a;});
  return j;
}
/* 实时出稿区行渲染：只读版逐句稿（无 contenteditable/删除按钮）。
   shownN = 前 N 句显示全文（打字基线），其余渲染空 .tx 等打字机接管。 */
function liveSegsHTML(segs,shownN){
  if(shownN==null)shownN=segs.length;
  return segs.map(function(s,i){
    return '<div class="seg"><span class="ts">'+fmtMs(s.t_ms)+'</span>'+
      '<span class="spk" style="color:'+(s.spk>=0?SPKC[s.spk%4]:'var(--dim)')+'">'+spkName(s.spk)+'</span>'+
      '<span class="tx">'+(i<shownN?esc(s.text):'')+'</span></div>';
  }).join('');
}
/* 逐字打字机：流式引擎逐句回调已是真增量，前端把新到句子按字逐步显现，观感即"逐字冒出"。
   打字速度随积压队列自适应（队列越长出字越快，尽快追平）；只在底部附近时跟随滚动。 */
var liveType={rid:null,n:0,queue:[],timer:0};
function liveTypeReset(){
  if(liveType.timer){clearInterval(liveType.timer);liveType.timer=0;}
  liveType.rid=null;liveType.n=0;liveType.queue=[];
}
/* 转写中拉增量句子：只更新实时出稿区 DOM，不重渲染详情（不打断播放）。 */
function refreshLive(rid){
  api('/records/'+rid).then(function(nu){
    if(!S.rec||S.rec.id!==rid||S.rec.status!=='asr')return;
    S.rec.segments=nu.segments||[];
    var segs=S.rec.segments;
    var box=document.getElementById('liveSegs');
    if(!box||!segs.length)return;
    if(liveType.rid!==rid){liveTypeReset();liveType.rid=rid;}
    if(segs.length<liveType.n){ /* 句数变少 = 机器层被重转写结果替换，从头显示新稿 */
      liveType.n=0;liveType.queue=[];
      if(liveType.timer){clearInterval(liveType.timer);liveType.timer=0;}
    }
    if(segs.length<=liveType.n)return; /* 没有新句子：不动 DOM，打字机继续 */
    var stick=box.scrollHeight-box.scrollTop-box.clientHeight<60;
    box.innerHTML=liveSegsHTML(segs,liveType.n);
    if(stick)box.scrollTop=box.scrollHeight;
    for(var i=liveType.n;i<segs.length;i++){
      liveType.queue.push({tx:box.children[i].querySelector('.tx'),text:segs[i].text,rev:0});
    }
    liveType.n=segs.length;
    if(!liveType.timer)liveType.timer=setInterval(typeTick,60);
    var cnt=document.getElementById('liveCnt');
    if(cnt)cnt.textContent='实时出稿 · 已 '+segs.length+' 句 · 完成前为机器稿，暂不可修订';
  }).catch(function(){});
}
function typeTick(){
  var box=document.getElementById('liveSegs'),q=liveType.queue;
  if(!box){liveTypeReset();return;}
  if(!q.length){ /* 打完了：只停表。清 rid/n 会让下轮 refreshLive 认为换了记录，把全部旧句重打一遍 */
    if(liveType.timer){clearInterval(liveType.timer);liveType.timer=0;}
    return;
  }
  var near=box.scrollHeight-box.scrollTop-box.clientHeight<60;
  var it=q[0],step=1+Math.min(8,q.length); /* 积压越多出字越快 */
  it.rev=Math.min(it.text.length,it.rev+step);
  it.tx.textContent=it.text.slice(0,it.rev);
  if(it.rev>=it.text.length)q.shift();
  if(near)box.scrollTop=box.scrollHeight;
}
/* 转写进度直刷：挂在 3s 统计轮询上。详情页进度条就地更新（不重渲染，避免打断播放）；
   任务从活跃队列消失（已完成或失败）时拉新详情与列表，自动切出转写稿/失败卡片。 */
function syncTrans(){
  if(cur!=='lib'||!S.rec)return;
  var r=S.rec;
  if(r.status==='asr'||r.status==='queued'){
    var j=jobFor(r.id);
    var txt=document.getElementById('transTxt');
    if(j&&j.state==='running'){
      var p=(j.progress*100|0);
      var bar=document.getElementById('transPbar');
      if(bar)bar.style.width=p+'%';
      if(txt)txt.textContent='正在转写 '+p+'%';
      if(!r.engine||STREAM_ENGINES[r.engine])refreshLive(r.id); /* 批量引擎没有增量可拉，跳过 */
    }else if(j&&j.state==='queued'){
      if(txt)txt.textContent='排队等待中…';
    }else{
      r.status='refresh'; /* 等待拉新期间不重复触发 */
      liveTypeReset();
      loadDetail(r.id);loadList();
    }
  }
  /* 列表里转写中的记录，状态 chip 就地追加百分比；任务消失时整表刷新一次 */
  var needList=false;
  S.list.forEach(function(x){
    if(x.status!=='asr'&&x.status!=='queued')return;
    var lj=jobFor(x.id);
    if(lj&&lj.state==='running'){
      var chip=document.querySelector('.ritem[data-id="'+x.id+'"] .st.asr');
      if(chip)chip.textContent='转写中 '+(lj.progress*100|0)+'%';
    }else if(!lj&&x.status!=='refresh'){
      x.status='refresh';needList=true;
    }
  });
  if(needList)loadList();
}

/* 录音流上的转写进度联动：流卡片只显示状态 chip，任务消失（完成/失败）时整流刷新一次 */
function syncStreamJobs(){
  if(cur!=='stream'||!ST.list.length)return;
  var need=false;
  ST.list.forEach(function(x){
    if(x.status!=='asr'&&x.status!=='queued')return;
    var lj=jobFor(x.id);
    if(lj&&lj.state==='running'){
      var chip=document.querySelector('.sc[data-id="'+x.id+'"] .st.asr');
      if(chip)chip.textContent='转写中 '+(lj.progress*100|0)+'%';
    }else if(!lj&&x.status!=='refresh'){
      x.status='refresh';need=true;
    }
  });
  if(need)loadStream();
}

var S={list:[],sel:null,rec:null,filter:'',cat:'',q:'',page:0,limit:50,total:0,cats:[],
  untagged:0,batch:false,picks:{}};
document.getElementById('globalSearch').addEventListener('keydown',function(e){
  if(e.key==='Enter'){go('lib');document.getElementById('libSearch').value=this.value;S.q=this.value;loadList();}
});
document.getElementById('libSearch').addEventListener('input',function(){
  S.q=this.value.trim();S.page=0;clearTimeout(this._h);this._h=setTimeout(loadList,300);
});
document.querySelectorAll('#fchips .chip').forEach(function(c){
  c.onclick=function(){
    document.querySelectorAll('#fchips .chip').forEach(function(x){x.classList.remove('on')});
    c.classList.add('on');S.filter=c.dataset.f;S.page=0;loadList();
  };
});
function renderCats(){
  var box=document.getElementById('catChips');
  var cats=(S.cats||[]).filter(function(c){return c.cat;});
  if(!cats.length&&!S.untagged){box.style.display='none';return;}
  box.style.display='flex';
  var h='<span class="chip'+(S.cat?'':' on')+'" data-c="">全部标签</span>';
  if(S.untagged)h+='<span class="chip'+(S.cat==='__none__'?' on':'')+'" data-c="__none__">未分类 <span style="opacity:.6">'+S.untagged+'</span></span>';
  cats.forEach(function(c){
    h+='<span class="chip'+(S.cat===c.cat?' on':'')+'" data-c="'+esc(c.cat)+'">'+esc(c.cat)+' <span style="opacity:.6">'+c.n+'</span></span>';
  });
  h+='<span class="chip'+(S.batch?' on':'')+'" id="chipBatch" title="勾选多条记录后批量设标签">批量</span>';
  box.innerHTML=h;
  box.querySelectorAll('.chip[data-c]').forEach(function(ch){
    ch.onclick=function(){
      S.cat=ch.dataset.c;S.page=0;
      box.querySelectorAll('.chip[data-c]').forEach(function(x){x.classList.toggle('on',x===ch)});
      loadList();
    };
  });
  var bc=document.getElementById('chipBatch');
  if(bc)bc.onclick=toggleBatch;
}
/* ================= 批量归类（配"未分类"筛选：先筛出来再批量打标签） ================= */
function toggleBatch(){
  S.batch=!S.batch;S.picks={};
  renderCats();renderList();renderBatchBar();
}
function renderBatchBar(){
  var bar=document.getElementById('batchBar');
  if(!bar)return;
  if(!S.batch){bar.style.display='none';return;}
  var n=0;for(var k in S.picks)n++;
  var opts=(S.cats||[]).filter(function(c){return c.cat;})
    .map(function(c){return '<option value="'+esc(c.cat)+'">'+esc(c.cat)+'</option>';}).join('');
  bar.style.display='flex';
  bar.innerHTML='已选 <b>'+n+'</b> 条'+
    '<select id="batchCat">'+opts+'<option value="">— 清除标签 —</option><option value="__new__">＋ 新建标签…</option></select>'+
    '<button class="btn sm accent" id="batchApply">设为</button>'+
    '<button class="btn sm ghost" id="batchAll">全选本页</button>'+
    '<button class="btn sm ghost" id="batchExit">退出</button>';
  document.getElementById('batchApply').onclick=function(){
    var ids=Object.keys(S.picks);
    if(!ids.length){toast('先勾选记录');return;}
    var v=document.getElementById('batchCat').value;
    if(v==='__new__'){v=prompt('新标签名：','');if(v===null)return;v=v.trim();if(!v)return;}
    api('/records/batch-cat',{method:'POST',body:{ids:ids,cat:v}})
      .then(function(r){toast('已把 '+r.updated+' 条设为'+(v?'「'+v+'」':'未分类'));
        S.batch=false;S.picks={};loadList();})
      .catch(function(e){toast('批量设置失败：'+e.message);});
  };
  document.getElementById('batchAll').onclick=function(){
    var allPicked=S.list.every(function(x){return S.picks[x.id];});
    S.list.forEach(function(x){ if(allPicked)delete S.picks[x.id]; else S.picks[x.id]=1; });
    renderList();renderBatchBar();
  };
  document.getElementById('batchExit').onclick=toggleBatch;
}
function renderPager(el,page,limit,total,goPage){
  var pages=Math.max(1,Math.ceil(total/limit));
  if(pages<=1&&page===0){el.innerHTML='';return;}
  var h='<button'+(page<=0?' disabled':'')+' data-pg="prev">‹ 上一页</button>'+
    '<span>第 <span class="cur">'+(page+1)+'</span> / '+pages+' 页 · 共 '+total+' 条</span>'+
    '<button'+(page>=pages-1?' disabled':'')+' data-pg="next">下一页 ›</button>';
  el.innerHTML=h;
  el.querySelector('[data-pg="prev"]').onclick=function(){if(page>0)goPage(page-1);};
  el.querySelector('[data-pg="next"]').onclick=function(){if(page<pages-1)goPage(page+1);};
}
function loadList(){
  var p='/records?limit='+S.limit+'&offset='+(S.page*S.limit)+
    (S.filter?'&status='+S.filter:'')+(S.cat?'&cat='+encodeURIComponent(S.cat):'')+
    (S.q?'&q='+encodeURIComponent(S.q):'');
  api(p).then(function(r){
    S.list=r.records;S.total=r.total||0;S.cats=r.cats||[];S.untagged=r.untagged||0;
    if(S.page>0&&!S.list.length){S.page=Math.max(0,Math.ceil(S.total/S.limit)-1);return loadList();}
    if(S.sel && !r.records.some(function(x){return x.id===S.sel}))S.sel=null;
    if(!S.sel && r.records.length)S.sel=r.records[0].id;
    renderCats();renderList();
    renderPager(document.getElementById('rPager'),S.page,S.limit,S.total,function(pg){S.page=pg;loadList();});
    if(S.sel)loadDetail(S.sel);
  }).catch(function(e){toast(e.message)});
}
function renderList(){
  var b=document.getElementById('rlist');b.innerHTML='';
  renderBatchBar(); /* 与 S.batch 同步：批量应用后 loadList 重渲染列表，操作条要跟着收起 */
  if(!S.list.length){b.innerHTML='<div class="emptybox">没有记录<br>从 App 同步，或在「转写任务」页导入音频</div>';return;}
  S.list.forEach(function(r){
    var el=document.createElement('div');
    el.className='ritem'+(S.batch?(S.picks[r.id]?' picked':''):(r.id===S.sel?' on':''));
    el.dataset.id=r.id; /* 供 syncTrans 就地更新转写进度 chip */
    var st=r.edited?'<span class="st ed">修订</span>':stChip(r.status);
    var defT=isDefaultTitle(r.title);
    el.innerHTML='<div class="t">'+(S.batch?'<span class="pickbox">'+(S.picks[r.id]?'☑':'☐')+'</span>':'')+
      (defT?esc(fmtDT(r.created_at))+relChip(r.created_at):esc(r.title||r.id))+st+'</div>'+
      '<div class="m"><span>'+fmtTime(r.created_at)+'</span><span>'+fmtDur(r.dur_ms)+'</span>'+

/* 由记录 id 伪随机生成占位波形（与音频内容无关，仅装饰）。
   注意经典 LCG 必须对 233280 取模：若对 2^32 取模（>>>0），
   x/233280 可达 ~1.8 万，条高会到百万百分比，波形条直接爆出卡片。 */
function waveHeights(id,n){
  var h=[],x=0;
  for(var i=0;i<id.length;i++)x=(x*31+id.charCodeAt(i))>>>0;
  x=x||1;
  for(i=0;i<n;i++){x=(x*9301+49297)%233280;h.push(20+(x/233280)*78);}
  return h;
}

/* 分类标签：候选 = 库内已有标签（安卓端自定义的可直接选），也可新建。
   列表上的标签 chips 由 loadList 的 cats 驱动，两端看到的是同一套。 */
/* 标签选择：点 chip 弹下拉菜单（已有标签 + 新建），替代 prompt 手输。
   服务器标签是自由字符串，安卓端拉取时会按名字对上/新建本地分类。
   锚点与回调参数化：记录库详情页、录音流卡片共用同一套菜单。 */
function pickCatAt(r,anchorRect,onDone,cats){
  closeCatMenu();
  var names=(cats||[]).map(function(c){return c.cat;}).filter(Boolean);
  if(r.cat&&names.indexOf(r.cat)<0)names.unshift(r.cat);
  var m=document.createElement('div');m.className='catmenu';m.id='catMenu';
  function item(label,val){
    var b=document.createElement('button');
    b.textContent=label;
    if(val&&val===r.cat)b.className='on';
    b.onclick=function(){closeCatMenu();applyCat(r,val,onDone);};
    m.appendChild(b);
  }
  if(r.cat)item('未分类','');
  names.forEach(function(n){item(n,n);});
  var nb=document.createElement('button');nb.textContent='＋ 新建标签…';nb.className='new';
  nb.onclick=function(){
    closeCatMenu();
    var v=prompt('新标签名：','');if(v===null)return;
    v=v.trim();if(v)applyCat(r,v,onDone);
  };
  m.appendChild(nb);
  document.body.appendChild(m);
  m.style.left=Math.max(8,Math.min(anchorRect.left,window.innerWidth-m.offsetWidth-8))+'px';
  m.style.top=Math.min(anchorRect.bottom+6,window.innerHeight-m.offsetHeight-8)+'px';
  document.addEventListener('mousedown',catMenuOutside);
}
function pickCat(r){
  pickCatAt(r,document.getElementById('catChip').getBoundingClientRect(),null,S.cats);

function applyCat(r,v,onDone){
  api('/records/'+r.id,{method:'PATCH',body:{cat:v}})
    .then(function(){
      r.cat=v;toast(v?'标签已设为 '+v:'标签已清除');
      addCatEverywhere(v); /* 新标签立即进两页的候选快照，别的卡片不用刷新就能选到 */
      if(onDone)onDone();else{renderDetail();loadList();}
    })
    .catch(function(e){toast('标签保存失败：'+e.message);});
}
/* 记录库（S）与录音流（ST）各持一份标签快照；打标签成功后把它同步进两份，
   缓存里没有 = 库内首条，计数从 1 起（下次 load 会带回准确值）。 */
function addCatEverywhere(v){
  if(!v)return;
  [S,ST].forEach(function(p){
    p.cats=p.cats||[];
    if(!p.cats.some(function(c){return c.cat===v;}))p.cats.push({cat:v,n:1});
  });
}

function setupPlayer(r){
  if(window._curAudio){try{window._curAudio.pause();}catch(e){}}
  unmountLibWave();
  audio=new Audio(r.audio_url);audio.preload='metadata';
  audio.defaultPlaybackRate=RATE.vals[RATE.i]; /* load 会把 playbackRate 回退到 default，两处都设 */
  audio.playbackRate=RATE.vals[RATE.i];
  window._curAudio=audio;
  var wave=document.getElementById('wave');
  /* 精确波形（与录音流统一）：挂载即解码绘制，常驻显示方便播放前定位；
     WS 不可用/解码失败时退化为装饰波形（点击 seek 仍由下方 wave.onclick 兜底） */
  LBWS=createWave(wave,audio,r.audio_url);
  if(LBWS)LBWS.on('ready',function(){paintSilCached(r,wave,LBWS.getDuration());});
  else{
    var n=Math.max(24,Math.min(120,Math.floor(wave.clientWidth/5)))||72;
    waveHeights(r.id,n).forEach(function(p){var i=document.createElement('i');
      i.style.cssText='flex:1 1 0;min-width:1px;height:'+p+'%;background:#2b303b;border-radius:2px';
      wave.appendChild(i);});
  }
  var btn=document.getElementById('pbtn');
  function paintBtn(){
    btn.innerHTML=audio.paused
      ?'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>'
      :'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
  }
  function dur(){
    var d=audio.duration;
    return isFinite(d)&&d>0?d:(r.dur_ms>0?r.dur_ms/1000:0);
  }
  function seek(sec){
    var d=dur();
    if(d>0)sec=Math.max(0,Math.min(sec,d));
    if(audio.readyState>=1)audio.currentTime=sec;
    else audio._pendingSeek=sec; /* 元数据未就绪时浏览器会忽略 currentTime，先挂起 */
  }
  audio._seek=seek; /* 供逐句稿时间戳跳转复用 */
  /* 跳过静音（与录音流共用全局开关 SKIP.on 与分析缓存 WAVES） */
  var skipBtn=document.getElementById('skipBtn');
  function paintSkip(){skipBtn.classList.toggle('accent',SKIP.on);}
  skipBtn.onclick=function(){
    SKIP.on=!SKIP.on;paintSkip();
    try{localStorage.setItem('vn.stskip',SKIP.on?'1':'0');}catch(e){}
    var st=document.getElementById('stSkip');
    if(st)st.classList.toggle('on',SKIP.on); /* 两处开关UI保持一致 */
    if(SKIP.on&&!audio.paused)
      analyzeAudio(r).promise.then(function(){skipSilence(r,audio,true);});
    toast(SKIP.on?'已开启跳过静音（所有播放器生效）':'已关闭跳过静音');
  };
  paintSkip();
  audio.addEventListener('timeupdate',function(){
    if(SKIP.on&&!audio.paused)skipSilence(r,audio); /* rAF 可能被节流，跳过静音挂在必发的事件上 */
    paint();
  }); /* 兜底：rAF 只在播放时跑，暂停/拖动后的状态靠事件刷 */
  /* timeupdate 每秒仅触发约 4 次，进度高亮会一顿一顿；播放期间用 rAF 逐帧重绘。
     循环自终止：暂停或切走（audio 被 pause / 不再是 _curAudio）后下一帧自动停。 */
  var rafId=0,me=audio; /* 绑定实例：切换记录后旧循环自然退出，不与新循环重复跑 */
  function rafStep(){
    if(!me.paused&&me===window._curAudio){
      if(SKIP.on)skipSilence(r,me); /* 分析未就绪时 skipSilence 自动空转 */
      paint();rafId=requestAnimationFrame(rafStep);
    }
    else rafId=0;
  }
  audio.addEventListener('play',function(){paintBtn();if(SKIP.on)analyzeAudio(r);if(!rafId)rafId=requestAnimationFrame(rafStep);});
  audio.addEventListener('pause',function(){paintBtn();paint();});
  audio.addEventListener('loadedmetadata',function(){
    if(audio._pendingSeek!=null){audio.currentTime=audio._pendingSeek;audio._pendingSeek=null;}
    paint();
  });
  paintBtn();paint();
  btn.onclick=function(){audio.paused?audio.play():audio.pause();};
  wave.onclick=function(e){
    var rect=wave.getBoundingClientRect();
    seek((e.clientX-rect.left)/rect.width*dur());
    if(SKIP.on)skipSilence(r,audio); /* seek 落进静音段也直接跳出去 */
  };
  var rate=document.getElementById('rateBtn');
  rate.textContent=RATE.vals[RATE.i]+'×'; /* 与录音流共用全局档位，回来时同步显示 */
  rate.onclick=function(){this.textContent=cycleRate()+'×';toast('倍速 '+this.textContent);};
}
/* 时间显示。进度着色由 WaveSurfer 自理，这里只刷 ptime 文本。 */
function paint(){
  var r=S.rec;
  if(!r||audio!==window._curAudio)return;
  var d=audio.duration;
  if(!isFinite(d)||d<=0)d=r.dur_ms>0?r.dur_ms/1000:0;

}

function openRecord(id,segId){

/* ================= 波形/静音分析（所有播放器共用） =================
   按记录解码一次缓存静音区间 sil：跳静音逻辑与流卡片的静音压暗层共用。
   波形绘制本身交给 WaveSurfer（vendor/ 本地库），逐像素算 min/max 包络。
   跳过静音开关是全局状态，记录库播放器与录音流卡片读写同一份。 */
var WAVES={},SKIP={on:false},_actx=null;
try{SKIP.on=localStorage.getItem('vn.stskip')==='1';}catch(e){}
/* 播放倍速：全局状态，记录库与录音流的倍速按钮读写同一份，localStorage 记忆 */
var RATE={vals:[1,1.25,1.5,2],i:0};
try{
  var si=RATE.vals.indexOf(parseFloat(localStorage.getItem('vn.rate')));
  if(si>=0)RATE.i=si;
}catch(e){}
function cycleRate(){
  RATE.i=(RATE.i+1)%RATE.vals.length;
  try{localStorage.setItem('vn.rate',RATE.vals[RATE.i]);}catch(e){}
  if(window._curAudio){
    /* defaultPlaybackRate 也要设：WS 挂载会重设 src 触发 load，playbackRate 会回退到它 */
    window._curAudio.defaultPlaybackRate=RATE.vals[RATE.i];
    window._curAudio.playbackRate=RATE.vals[RATE.i];
  }
  /* 两处倍速按钮同步显示 */
  ['stRate','rateBtn'].forEach(function(id){
    var b=document.getElementById(id);
    if(b)b.textContent=RATE.vals[RATE.i]+'×';
  });
  return RATE.vals[RATE.i];
}
function analyzeAudio(rec){
  var w=WAVES[rec.id];
  if(w)return w;
  w=WAVES[rec.id]={pending:true,sil:[]};
  w.promise=fetch(rec.audio_url).then(function(r){return r.arrayBuffer();}).then(function(buf){
    if(!_actx)_actx=new (window.AudioContext||window.webkitAudioContext)();
    return _actx.decodeAudioData(buf);
  }).then(function(ab){
    /* 静音段：50ms 窗 RMS，阈值取自适应底线；连片 >=0.35s 记为静音 */
    var d=ab.getChannelData(0),n=d.length,i,j,off,
        win=Math.floor(ab.sampleRate*0.05)||1,sams=[];
    for(off=0;off<n;off+=win){
      var sum=0,cnt=0;
      for(j=off;j<Math.min(off+win,n);j+=8){sum+=d[j]*d[j];cnt++;}
      sams.push(Math.sqrt(sum/(cnt||1)));
    }
    var sorted=sams.slice().sort(function(a,b){return a-b;});
    var thr=Math.max(0.012,sorted[Math.floor(sorted.length*0.08)]*1.6),sil=[],run=null,t=0;
    for(i=0;i<sams.length;i++){
      var ts=(i*win)/ab.sampleRate;
      if(sams[i]<=thr){ if(!run)run={s:ts}; }
      else if(run){ if(ts-run.s>=0.35)sil.push([run.s,ts]); run=null; }
      t=ts;
    }
    if(run&&t-run.s>=0.35)sil.push([run.s,t]);
    w.sil=sil;w.pending=false;
    return w;
  }).catch(function(){
    w.sil=[];w.pending=false;
    return w;
  });
  return w;
}
/* 播放位置落在静音区间内（且已进入 0.12s，避免误跳句间换气）就跳到区间尾 */
function skipSilence(rec,audio,force){
  if(!audio||!rec||!SKIP.on)return;
  var w=WAVES[rec.id];
  if(!w||w.pending||!w.sil.length)return;
  var t=audio.currentTime;
  for(var k=0;k<w.sil.length;k++){
    var s=w.sil[k];
    if(t>=s[0]+(force?0:0.12)&&t<s[1]){audio.currentTime=s[1];return;}
  }
}
/* 在波形容器上铺静音压暗层（记录库与录音流共用） */
function paintSilOverlays(box,sil,dur){
  if(!box||!dur)return;
  box.querySelectorAll('.silov').forEach(function(x){x.remove();});
  (sil||[]).forEach(function(s){
    if(s[0]>=dur)return;
    var ov=document.createElement('div');ov.className='silov';
    ov.style.left=(s[0]/dur*100)+'%';
    ov.style.width=((Math.min(s[1],dur)-s[0])/dur*100)+'%';
    box.appendChild(ov);
  });
}
/* 静音层取自 analyzeAudio 缓存（未解析完就等 promise），时长用 WS 解码出的真实值 */
function paintSilCached(rec,box,dur){
  var w=WAVES[rec.id];
  if(w&&!w.pending){paintSilOverlays(box,w.sil,dur);return;}
  analyzeAudio(rec).promise.then(function(){
    paintSilOverlays(box,WAVES[rec.id]?WAVES[rec.id].sil:[],dur);
  });
}
/* 创建 WaveSurfer 精确波形（记录库播放器与录音流卡片共用样式与参数）。
   注意 WS 拿到 url 会重设 media.src，打断进行中的 play()：
   录音流在 ready 后才起播；记录库挂载时未在播放，无此问题。 */
function createWave(box,a,url){
  if(typeof WaveSurfer==='undefined')return null;
  box.innerHTML='<div></div>'; /* WaveSurfer 会在容器上挂 shadow root，留一层壳保住静音层的位置 */
  try{
    return WaveSurfer.create({
      container:box.firstChild, media:a, url:url,
      height:44, normalize:true, cursorWidth:0, hideScrollbar:true,
      waveColor:'#2b303b', progressColor:'#7b6cf6',
    });
  }catch(e){return null;}
}
/* 空格键：暂停/继续当前播放（两处播放器共用 window._curAudio 单实例）。
   焦点在输入框/可编辑区时不拦截；暂停中波形保持显示，可拖动调进度。 */
document.addEventListener('keydown',function(e){
  if(e.code!=='Space')return;
  var t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  var a=window._curAudio;
  if(!a)return;
  e.preventDefault();
  if(a.paused)a.play().catch(function(){});else a.pause();
});

/* ================= 录音流 =================
   平铺展示筛选结果的全部转写内容（3 行收起，点开看全文），播完一条自动接下一条，
   供批量 review。筛选/搜索与记录库同源（status/cat/q），卡片上可直接重转写、打标签。 */
var ST={list:[],filter:'',cat:'',q:'',page:0,limit:50,total:0,cats:[],untagged:0,
  auto:false,playingId:null,audio:null,open:{}};
document.getElementById('stSearch').addEventListener('input',function(){

});
document.querySelectorAll('#stFchips .chip').forEach(function(c){

  };
});
document.getElementById('stAuto').onclick=function(){
  ST.auto=!ST.auto;this.classList.toggle('on',ST.auto);
  try{localStorage.setItem('vn.stauto',ST.auto?'1':'0');}catch(e){}

};
document.getElementById('stSkip').onclick=function(){
  SKIP.on=!SKIP.on;this.classList.toggle('on',SKIP.on);
  try{localStorage.setItem('vn.stskip',SKIP.on?'1':'0');}catch(e){}
  if(SKIP.on&&ST.audio&&!ST.audio.paused)
    skipSilence(ST.list.filter(function(x){return x.id===ST.playingId;})[0],ST.audio,true);
  toast(SKIP.on?'已开启跳过静音（所有播放器生效）':'已关闭跳过静音');
};
document.getElementById('stRate').onclick=function(){
  this.textContent=cycleRate()+'×';
  toast('倍速 '+this.textContent+'（与记录库共用）');
};
try{
  if(localStorage.getItem('vn.stauto')==='1'){ST.auto=true;
    document.getElementById('stAuto').classList.add('on');}
  if(SKIP.on)document.getElementById('stSkip').classList.add('on');
  document.getElementById('stRate').textContent=RATE.vals[RATE.i]+'×';
}catch(e){}

function loadStream(){
  var p='/records?limit='+ST.limit+'&offset='+(ST.page*ST.limit)+'&preview_len=400'+
    (ST.filter?'&status='+ST.filter:'')+(ST.cat?'&cat='+encodeURIComponent(ST.cat):'')+
    (ST.q?'&q='+encodeURIComponent(ST.q):'');
  api(p).then(function(r){
    ST.list=r.records;ST.total=r.total||0;ST.cats=r.cats||[];ST.untagged=r.untagged||0;
    if(ST.page>0&&!ST.list.length){ST.page=Math.max(0,Math.ceil(ST.total/ST.limit)-1);return loadStream();}
    if(ST.playingId && !ST.list.some(function(x){return x.id===ST.playingId;}))stopStreamAudio();
    renderStCats();renderStream();
    renderPager(document.getElementById('stPager'),ST.page,ST.limit,ST.total,
      function(pg){ST.page=pg;loadStream();});
    document.getElementById('stSub').textContent='共 '+ST.total+' 场 · 从上往下连播 review';
  }).catch(function(e){toast(e.message)});
}
function renderStCats(){

  if(ST.untagged)h+='<span class="chip'+(ST.cat==='__none__'?' on':'')+'" data-c="__none__">未分类 <span style="opacity:.6">'+ST.untagged+'</span></span>';
  cats.forEach(function(c){
    h+='<span class="chip'+(ST.cat===c.cat?' on':'')+'" data-c="'+esc(c.cat)+'">'+esc(c.cat)+' <span style="opacity:.6">'+c.n+'</span></span>';
  });

  box.querySelectorAll('.chip[data-c]').forEach(function(ch){
    ch.onclick=function(){
      ST.cat=ch.dataset.c;ST.page=0;
      box.querySelectorAll('.chip[data-c]').forEach(function(x){x.classList.toggle('on',x===ch)});
      loadStream();

}
/* 流卡片：一行标题+元信息+操作，细进度条，3 行转写正文 */
function renderStream(){
  var b=document.getElementById('stList');b.innerHTML='';
  if(!ST.list.length){b.innerHTML='<div class="emptybox">没有记录<br>换个筛选条件，或从 App 同步 / 导入音频</div>';return;}
  ST.list.forEach(function(r){
    var el=document.createElement('div');
    el.className='sc'+(ST.playingId===r.id?' playing':'')+(ST.open[r.id]?' open':'');
    el.dataset.id=r.id;
    var st=r.edited?'<span class="st ed">修订</span>':stChip(r.status);
    var defT=isDefaultTitle(r.title);
    el.innerHTML='<div class="hd">'+
      (r.has_audio?'<button class="pbtn" data-play title="播放">'+(ST.playingId===r.id?SVG_PAUSE:SVG_PLAY)+'</button>':'')+
      '<span class="tt" title="到记录库打开">'+(defT?esc(fmtDT(r.created_at)):esc(r.title||r.id))+'</span>'+
      (defT?relChip(r.created_at):'')+
      '<span class="mt2">'+st+'<span>'+fmtTime(r.created_at)+'</span><span>'+fmtDur(r.dur_ms)+'</span>'+
      (r.device?'<span class="dev">'+esc(r.device)+'</span>':'')+
      '<span class="catchip" data-cat style="cursor:pointer">'+esc(r.cat||'未分类')+' ▾</span></span>'+
      '<span class="grow"></span>'+
      '<span class="acts">'+
      '<button class="op" data-meta>详情</button>'+
      '<button class="op" data-retr>重转写</button>'+
      '<button class="op" data-del style="color:var(--err)">删除</button></span></div>'+
      (r.has_audio?'<div class="wave" data-wave></div>':'')+
      '<div class="txt'+(r.preview?'':' dim')+'">'+(r.preview?esc(r.preview):'暂无转写内容')+'</div>'+
      '<div class="ft"><button class="op" data-more style="display:none">展开</button></div>';
    b.appendChild(el);
    wireStreamCard(el,r);
  });
  /* 播放中的卡片被重渲染（loadStream/打标签等）：把已挂载的波形容器原样搬进新卡片，
     不重建 WaveSurfer——重建会再次重设 audio.src，打断正在进行的播放 */
  if(ST.playingId&&ST.audio&&STWS&&STWSBox){
    var cardEl=document.querySelector('.sc[data-id="'+ST.playingId+'"]');
    var nb=cardEl&&cardEl.querySelector('[data-wave]');
    if(nb&&nb!==STWSBox)nb.replaceWith(STWSBox);

/* 卡片内交互：播放/暂停（全局单实例+ended 连播，空格键同样生效）、重转写、标签、删除、展开 */
function wireStreamCard(el,r){
  var pb=el.querySelector('[data-play]');
  if(pb)pb.onclick=function(){
    /* 播放中再点=暂停/继续（暂停时波形保持显示，可拖动调进度）；换卡直接切 */
    if(ST.playingId===r.id&&ST.audio){
      ST.audio.paused?ST.audio.play().catch(function(){toast('播放失败');}):ST.audio.pause();
      return;
    }
    playStreamCard(r.id);
  };
  el.querySelector('.tt').onclick=function(){openRecord(r.id);};
  el.querySelector('[data-meta]').onclick=function(){openMeta(r.id);};
  var rt=el.querySelector('[data-retr]');
  if(rt)rt.onclick=function(){
    api('/records/'+r.id+'/transcribe',{method:'POST',body:{}})
      .then(function(){toast('已入队');loadStream();loadStats();})
      .catch(function(e){toast(e.message)});
  };
  var cc=el.querySelector('[data-cat]');
  cc.onclick=function(){pickStreamCat(el,r);};
  var dl=el.querySelector('[data-del]');
  dl.onclick=function(){
    if(!confirm('删除「'+(r.title||r.id)+'」？音频与转写稿一并删除，不可恢复。'))return;
    api('/records/'+r.id,{method:'DELETE'})
      .then(function(){if(ST.playingId===r.id)stopStreamAudio();toast('已删除');loadStream();loadStats();});
  };
  /* 波形上的点击/拖拽 seek 由 WaveSurfer 自带交互完成（media 绑定的就是 ST.audio） */
  /* 溢出才显示展开钮；-webkit-box 的 scrollHeight 即全文高度。
     卡片已 append 才能测出高度，且不能放 rAF（页签隐藏时不触发）。 */
  var txt=el.querySelector('.txt'),more=el.querySelector('[data-more]');
  if(txt.scrollHeight>txt.clientHeight+2){
    more.style.display='';
    more.onclick=function(){
      ST.open[r.id]=!ST.open[r.id];
      el.classList.toggle('open',ST.open[r.id]);
      more.textContent=ST.open[r.id]?'收起':'展开';
    };
  }
}
/* 流卡片波形：只在播放时挂载（media 绑定播放中的 Audio 实例），暂停中保持显示。
   换卡/停止时销毁实例，容器显示与否由 .playing 类控制（.sc .wave 默认 display:none）。
   注意 WS 拿到 url 会重设 media.src，打断进行中的 play()，所以起播要等它 ready。 */
var STWS=null,STWSBox=null;
function unmountStreamWave(){
  if(STWS){try{STWS.destroy();}catch(e){}}
  STWS=null;STWSBox=null;
}
function mountStreamWave(rec,a,auto){
  unmountStreamWave();
  var box=document.querySelector('.sc[data-id="'+rec.id+'"] [data-wave]');
  STWS=box?createWave(box,a,rec.audio_url):null;
  if(!STWS){
    if(auto)a.play().catch(function(){toast('播放失败');});
    return;
  }
  STWSBox=box;
  var kick=function(){
    paintSilCached(rec,box,STWS.getDuration());
    if(auto&&ST.audio===a&&ST.playingId===rec.id&&a.paused&&!a.ended)
      a.play().catch(function(){toast('播放失败');});
  };
  STWS.on('ready',kick);
  STWS.on('error',kick); /* 波形解码失败只留空波形，播放本身不受影响 */
}
function paintStreamCard(){
  var el=document.querySelector('.sc[data-id="'+ST.playingId+'"]');
  if(!el||!ST.audio)return;
  if(SKIP.on&&!ST.audio.paused)
    skipSilence(ST.list.filter(function(x){return x.id===ST.playingId;})[0],ST.audio);
  var pb=el.querySelector('[data-play]');
  if(pb)pb.innerHTML=ST.audio.paused?SVG_PLAY:SVG_PAUSE;
}
function stopStreamAudio(){
  if(ST.audio){try{ST.audio.pause();}catch(e){}}
  ST.audio=null;ST.playingId=null;
  unmountStreamWave();
  document.querySelectorAll('.sc.playing').forEach(function(x){x.classList.remove('playing')});
  /* pause 事件回调里 playingId 已清空、paintStreamCard 会提前返回，图标在这里统一归位 */
  document.querySelectorAll('.sc [data-play]').forEach(function(pb){pb.innerHTML=SVG_PLAY;});
}
function playStreamCard(id){
  var rec=ST.list.filter(function(x){return x.id===id;})[0];
  if(!rec||!rec.has_audio){toast('这条没有音频');return;}
  if(window._curAudio){try{window._curAudio.pause();}catch(e){}}
  stopStreamAudio();
  var a=new Audio(rec.audio_url);a.preload='metadata';
  a.defaultPlaybackRate=RATE.vals[RATE.i]; /* load 会把 playbackRate 回退到 default，两处都设 */
  a.playbackRate=RATE.vals[RATE.i];
  ST.audio=a;ST.playingId=id;
  window._curAudio=a;
  document.querySelectorAll('.sc[data-id="'+id+'"]').forEach(function(x){x.classList.add('playing')});
  a.addEventListener('play',paintStreamCard);
  a.addEventListener('pause',paintStreamCard);
  a.addEventListener('timeupdate',paintStreamCard);
  a.addEventListener('ended',function(){
    if(!ST.auto){paintStreamCard();return;}
    var i=ST.list.findIndex(function(x){return x.id===id;});
    for(var n=i+1;n<ST.list.length;n++){
      if(ST.list[n].has_audio){playStreamCard(ST.list[n].id);
        var el=document.querySelector('.sc[data-id="'+ST.list[n].id+'"]');
        if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
        return;}
    }
    toast('本页播完了');paintStreamCard();
  });
  paintStreamCard();
  mountStreamWave(rec,a,true); /* 波形此刻才挂载，就绪后自动起播；非播放卡片不占空间也不解码 */
}
/* 流卡片打标签：复用详情页的 catmenu（已有标签 + 新建） */
function pickStreamCat(el,r){
  var oldChip=el.querySelector('.catchip'),rc=oldChip.getBoundingClientRect();

    renderStream();

  },ST.cats);
}

var engines=[];
var J={page:0,limit:50,total:0};
function loadAsr(){
  Promise.all([api('/engines'),api('/jobs?limit='+J.limit+'&offset='+(J.page*J.limit))]).then(function(rs){
    engines=rs[0].engines;
    var def=rs[0].default;
    document.getElementById('asrSub').textContent='默认引擎 '+(engines.filter(function(e){return e.id===def})[0]||{}).name;
    var eb=document.getElementById('engs');eb.innerHTML='';
    engines.forEach(function(e){
      var el=document.createElement('div');
      el.className='eng'+(e.id===def?' on':'')+(e.available?'':' dis');
      el.innerHTML='<div class="r1"><span class="rdo"></span>'+esc(e.name)+'</div>'+
        '<div class="r2">'+esc(e.desc||'')+'</div>'+
        '<div class="r3">'+(e.id===def?'<span class="st done">默认</span>':'')+
        (e.available?'<span class="st ed">可用</span>':'<span class="st fail">不可用</span>')+'</div>';
      el.onclick=function(){
        if(!e.available){toast(e.name+' 不可用（缺依赖或未配置）');return;}
        api('/settings',{method:'PATCH',body:{default_engine:e.id}}).then(function(){loadAsr();toast('默认引擎 → '+e.name);});
      };
      eb.appendChild(el);
    });
    var tb=document.getElementById('jobRows');tb.innerHTML='';
    J.total=rs[1].total||0;
    if(!rs[1].jobs.length)tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--dim);padding:24px">队列为空</td></tr>';
    rs[1].jobs.forEach(function(j){
      var tr=document.createElement('tr');
      var stc;
      if(j.state==='running')stc='<div style="display:flex;gap:8px;align-items:center"><div class="pbar" style="width:80px"><i style="width:'+(j.progress*100|0)+'%"></i></div><span class="pnum">'+(j.progress*100|0)+'%</span></div>';
      else if(j.state==='done')stc='<span class="st done">完成</span>';
      else if(j.state==='fail')stc='<span class="st fail">失败</span> <span class="errtxt" title="'+esc(j.error||'')+'">'+esc((j.error||'').slice(0,60))+'</span>';
      else if(j.state==='cancel')stc='<span class="st raw">已取消</span>';
      else stc='<span class="st queued">排队</span>';
      var ops='';
      if(j.state==='fail'||j.state==='cancel')ops+='<button class="btn sm" data-retry>重试</button> ';
      if(j.state==='queued')ops+='<button class="btn sm ghost" data-cancel>取消</button>';
      if(j.state==='done')ops+='<button class="btn sm ghost" data-open>查看</button>';
      tr.innerHTML='<td class="nmw" data-open>'+esc(j.title||j.record_id)+'</td><td>'+esc(j.engine)+'</td>'+
        '<td>'+stc+'</td><td>'+fmtTime(j.created_at)+'</td><td style="text-align:right">'+ops+'</td>';
      tr.querySelector('[data-open]').onclick=function(){openRecord(j.record_id);};
      var rb=tr.querySelector('[data-retry]');
      if(rb)rb.onclick=function(){api('/jobs/'+j.id+'/retry',{method:'POST'}).then(function(){loadAsr();toast('已重新入队');}).catch(function(e){toast(e.message)});};
      var cb=tr.querySelector('[data-cancel]');
      if(cb)cb.onclick=function(){api('/jobs/'+j.id+'/cancel',{method:'POST'}).then(function(){loadAsr();}).catch(function(e){toast(e.message)});};
      tb.appendChild(tr);
    });
    renderPager(document.getElementById('jobPager'),J.page,J.limit,J.total,function(pg){J.page=pg;loadAsr();});
  }).catch(function(e){toast(e.message)});
}
function uploadFiles(files){
  var arr=[].slice.call(files);if(!arr.length)return;
  var chain=Promise.resolve();
  arr.forEach(function(f){
    chain=chain.then(function(){
      var fd=new FormData();fd.append('file',f);
      return fetch(API+'/records/upload',{method:'POST',body:fd}).then(function(r){
        return r.json().then(function(j){
          if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));return j;
        });
      }).then(function(j){toast('已导入 '+f.name+' → '+(j.id));})
        .catch(function(e){toast(f.name+' 导入失败：'+e.message);});
    });
  });
  chain.then(function(){loadAsr();loadStats();});
}

var aiInit=false,scopeRecs=[],scopeAll=true;
function initAi(){
  api('/settings').then(function(s){
    document.getElementById('mdlName').textContent=s.ai_model||'未配置';
  });
  if(!aiInit){
    aiInit=true;
    document.querySelectorAll('.qact .chip').forEach(function(ch){
      ch.onclick=function(){
        var t=document.getElementById('aiInput');
        var m={'生成纪要':'把所选范围的记录整理成会议纪要：主题、要点、待办',
               '提取待办':'从所选范围的记录里提取所有待办事项，注明负责人和截止时间',
               '总结本周':'总结本周的录音要点',
               '翻译成英文':'把最近一场记录的转写稿翻译成英文'};
        t.value=m[ch.textContent]||ch.textContent;t.focus();
      };
    });
    document.getElementById('btnSend').onclick=sendChat;
    document.getElementById('aiInput').addEventListener('keydown',function(e){
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
    });
    loadCtx();

}
function loadCtx(){
  api('/records?limit=20').then(function(r){
    scopeRecs=r.records;renderCtx();
  });
}
function renderCtx(){
  var b=document.getElementById('ctxRecs');b.innerHTML='';
  scopeRecs.forEach(function(r){
    var el=document.createElement('div');
    el.className='lim'+(r.id===S.sel&&!scopeAll?' on':'');
    el.innerHTML='<span class="dot" style="background:'+(r.id===S.sel&&!scopeAll?'var(--accent)':'#2a2e39')+'"></span>'+
      esc(r.title||r.id)+'<span class="n">'+fmtDur(r.dur_ms)+'</span>';
    el.onclick=function(){
      scopeAll=false;S.sel=r.id;
      document.querySelector('.ctx .lim[data-scope]').classList.remove('on');
      renderCtx();
    };
    b.appendChild(el);
  });
  document.querySelector('.ctx .lim[data-scope]').classList.toggle('on',scopeAll);
  document.getElementById('ctxAll').textContent=(stats?stats.records:'–')+' 场';
}
document.querySelector('.ctx .lim[data-scope]').onclick=function(){scopeAll=true;renderCtx();};
function addMsg(role,html){
  var box=document.getElementById('msgs');
  var el=document.createElement('div');
  if(role==='u'){el.className='msg u';el.textContent=html;}
  else{
    el.className='msg a';
    el.innerHTML='<div class="who"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7b6cf6" stroke-width="2"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>'+
      'AI</div><div class="bd">'+html+'</div>';
  }
  box.appendChild(el);box.scrollTop=box.scrollHeight;

function renderCites(text,cites){
  var html=esc(text).replace(/\[S(\d+)\]/g,function(m,n){
    var c=(cites||[]).filter(function(x){return x.ref==n;})[0];
    return c?'<span class="cite" data-cid="'+c.record_id+'" data-sid="'+c.seg_id+'">S'+n+'</span>':m;
  });
  return html;
}
function sendChat(){
  var t=document.getElementById('aiInput');
  var q=t.value.trim();if(!q)return;
  t.value='';
  addMsg('u',q);
  var el=addMsg('a','思考中…');
  var body={q:q};
  if(!scopeAll&&S.sel)body.record_ids=[S.sel];
  api('/ai/chat',{method:'POST',body:body}).then(function(r){
    el.querySelector('.bd').innerHTML=renderCites(r.answer,r.citations);
    el.querySelectorAll('.cite').forEach(function(c){
      c.onclick=function(){openRecord(c.dataset.cid,+c.dataset.sid);};
    });
    var box=document.getElementById('msgs');box.scrollTop=box.scrollHeight;
  }).catch(function(e){
    el.querySelector('.bd').innerHTML='<span style="color:var(--warn)">'+esc(e.message)+'</span>';
  });
}
