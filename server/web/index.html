  g.innerHTML=tabs+b;
  /* 可折叠分节标题：▾ 展开主体 / ▸ 收起到下一节（状态按标题持久化）。
     折叠范围 = 本节头之后、下一个 .sec 之前的所有兄弟元素。 */
  g.querySelectorAll('.sec').forEach(function(h){
    var apply=function(){
      var open=SEC_FOLD[h.dataset.title]!=='0';
      h.textContent=(open?'▾ ':'▸ ')+h.dataset.title;
      var n=h.nextElementSibling;
      while(n&&!n.classList.contains('sec')){
        n.style.display=open?'':'none';
        n=n.nextElementSibling;
      }
    };
    apply();
    h.onclick=function(){
      SEC_FOLD[h.dataset.title]=SEC_FOLD[h.dataset.title]==='0'?'1':'0';
      try{localStorage.setItem('voxnote.setFold',JSON.stringify(SEC_FOLD));}catch(e){}
      apply();
    };
  });
  g.querySelectorAll('[data-st]').forEach(function(el){
    el.onclick=function(){setTab=el.dataset.st;renderSet();};
  });
  g.querySelectorAll('[data-k]').forEach(function(el){
    var k=el.dataset.k;
    if(el.classList.contains('toggle'))el.onclick=function(){el.classList.toggle('on');setForm[k]=el.classList.contains('on');};
    else el.addEventListener('change',function(){setForm[k]=el.value;});
  });
  g.querySelectorAll('[data-eng]').forEach(function(el){
    el.onclick=function(){
      toggleEng(el.dataset.eng);
      renderSet();   // 被停用引擎的设置行即时收起/展开
    };
  });
  if(setTab==='stt'){ wireLlama();loadModel();loadWhisperModels(); }
  if(setTab==='sys'){
    document.getElementById('btnCopyTok').onclick=function(){
      navigator.clipboard.writeText(s.sync_token).then(function(){toast('令牌已复制');});
    };
    document.getElementById('btnResetTok').onclick=function(){
      if(!confirm('重置后旧令牌立即失效，已配对设备需要更新令牌。继续？'))return;
      api('/settings/reset-token',{method:'POST'}).then(function(r){toast('新令牌：'+r.sync_token);loadSettings();});
    };
    /* 扫码配对：QR 内容是 http 中转页（pair.html），任何相机扫码都认；
       中转页再跳 voxnote:// deep link 进 App。IP 由用户选——虚拟组网
       （Tailscale/ZeroTier）时手机走的是虚拟网卡地址，不是主 IP。 */
    var pairInfo=null;
    function pairUrl(ip){
      if(!pairInfo)return '';
      var host=ip+':'+pairInfo.port;
      return 'http://'+host+'/pair.html?host='+encodeURIComponent(host)+'&t='+encodeURIComponent(pairInfo.token);
    }
    function drawPairQr(){
      var sel=document.getElementById('pairIp'),box=document.getElementById('pairQr');
      if(!sel||!box||!pairInfo)return;
      var ip=sel.value;
      if(!ip){box.innerHTML='';return;}
      try{
        var q=qrcode(0,'M'); q.addData(pairUrl(ip)); q.make();
        box.innerHTML=q.createSvgTag({cellSize:4,margin:2});
      }catch(e){ box.innerHTML='<span class="hint">生成失败：'+esc(String(e))+'</span>'; }
    }
    api('/settings/pair-info').then(function(info){
      pairInfo=info;
      var sel=document.getElementById('pairIp');
      if(!sel)return;
      sel.innerHTML=(info.ips||[]).map(function(ip){return '<option>'+esc(ip)+'</option>';}).join('')||'<option value="">无可用 IP</option>';
      sel.onchange=drawPairQr;
      drawPairQr();
    }).catch(function(){});
    document.getElementById('btnPairQr').onclick=drawPairQr;
    document.getElementById('btnPwSave').onclick=function(){
      var v=document.getElementById('pairPw').value;
      if(!v){toast('先输入密码');return;}
      api('/settings',{method:'PATCH',body:{sync_password:v}}).then(function(){toast('连接密码已保存');loadSettings();})
        .catch(function(e){toast(e.message);});
    };
    var pwClear=document.getElementById('btnPwClear');
    if(pwClear)pwClear.onclick=function(){
      if(!confirm('清除后设备只能用令牌连接。继续？'))return;
      api('/settings',{method:'PATCH',body:{sync_password:''}}).then(function(){toast('已清除连接密码');loadSettings();})
        .catch(function(e){toast(e.message);});
    };
    document.getElementById('btnSaveStorage').onclick=function(){
      api('/storage',{method:'PATCH',body:{
        audio_dir:document.getElementById('setAudioDir').value.trim(),
        db_path:document.getElementById('setDbPath').value.trim()
      }}).then(function(r){toast(r.note||'已保存');loadSettings();})
        .catch(function(e){toast(e.message);});
    };
    /* 四个路径在服务器所在机器打开文件管理器（db 定位选中文件） */
    g.querySelectorAll('[data-open]').forEach(function(el){
      el.onclick=function(){
        api('/storage/open',{method:'POST',body:{target:el.dataset.open}}).catch(function(e){toast(e.message);});
      };
    });
    document.getElementById('btnCleanTemp').onclick=function(){
      api('/storage/clean-temp',{method:'POST'}).then(function(r){
        toast('已清理 '+r.removed+' 个文件');loadSettings();
      }).catch(function(e){toast(e.message);});
    };
  }
}

/* ================= 本地大模型（Qwen3-ASR · llama.cpp） ================= */
/* 预置量化清单：与 Whisper 一样一行一个、点「下载」即装；自定义仓库走独立行 */
var LLAMA_PRESETS=[
  {label:'q4_k_m（推荐）',repo:'foryoung365/Qwen3-ASR-1.7B-Q4_K_M-GGUF',
   hint:'≈1.31 GB · 2C/6G 机器推荐 · 含 mmproj 编码器'},
  {label:'q8_0',repo:'ggml-org/Qwen3-ASR-1.7B-GGUF',
   hint:'≈1.8 GB · 官方 ggml-org 仓库 · 精度更高'}];
function doLlamaDownload(repo,quant){
  api('/models/asr/download',{method:'POST',body:{repo:repo,quant:quant}})
    .then(function(){toast('开始下载（走 hf-mirror 镜像）');loadModel();})
    .catch(function(e){toast(e.message);});
}
function wireLlama(){
  /* 预置量化与自定义仓库在「获取模型」列，启停按钮在「转写引擎」卡：按存在与否接线 */
  document.querySelectorAll('[data-llamadl]').forEach(function(x){
    x.onclick=function(){doLlamaDownload(x.dataset.llamadl,'');};
  });
  var ci=document.getElementById('llamaRepoCustom'),cb=document.getElementById('btnDlCustom');
  if(ci&&cb)cb.onclick=function(){
    var r=ci.value.trim();
    if(!r||r.indexOf('/')<0){toast('仓库格式应为 用户名/仓库名');return;}
    doLlamaDownload(r,'');
  };
  var bs=document.getElementById('btnDlStop');
  if(bs)bs.onclick=function(){
    api('/models/asr/download/stop',{method:'POST'}).then(function(){toast('正在取消…');});
  };
  var sb=document.getElementById('btnSrv');
  if(sb)sb.onclick=function(){
    if(this.dataset.stop){
      api('/models/asr/server',{method:'POST',body:{action:'stop'}}).then(function(){loadModel();});
      return;
    }
    saveLlamaSettings(function(){
      var b=document.getElementById('btnSrv');if(b)b.disabled=true;
      api('/models/asr/server',{method:'POST',body:{action:'start'}})
        .then(function(){toast('llama-server 已就绪');loadModel();})
        .catch(function(e){toast(e.message);loadModel();});
    });
  };
}
function saveLlamaSettings(cb){
  var p={};
  ['llama_server_path','llama_port'].forEach(function(k){
    var el=document.querySelector('[data-k="'+k+'"]');
    if(el)p[k]=el.value;
  });
  api('/settings',{method:'PATCH',body:p}).then(cb).catch(function(e){toast(e.message)});
}
function loadModel(){
  api('/models/asr').then(function(m){
    /* 状态区在「本地模型」页、启停区在「转写」页：本函数两个页都会跑，全部按存在与否更新 */
    var st=document.getElementById('llamaStat');
    var mb=m.model;
    if(st){
      if(mb.ready){
        st.innerHTML='<span style="color:var(--ok)">已就绪，可直接使用</span> · 主模型 '+fmtBytes(mb.main_bytes)+
          ' · 编码器 '+fmtBytes(mb.mmproj_bytes);
      }else{
        var got=[];
        if(mb.main)got.push('主模型 '+fmtBytes(mb.main_bytes));
        if(mb.mmproj)got.push('编码器 '+fmtBytes(mb.mmproj_bytes));
        st.innerHTML='<span style="color:var(--warn)">'+(got.length?'不完整（已有 '+got.join(' + ')+'，还缺一部分，暂不可用）':'未下载')+'</span>';
      }
    }
    var dh=document.getElementById('llamaDlHint');
    if(dh)dh.textContent=mb.ready?'模型已就绪，无需下载；如要换量化，先在「③ 管理」里卸载现有文件':'选量化自动填仓库，也可手动改';
    var dl=m.download;
    var bar=document.getElementById('llamaDlBar'),dt=document.getElementById('llamaDlTxt'),
        bd=document.getElementById('btnDl'),bs=document.getElementById('btnDlStop');
    if(bd)bd.classList[mb.ready?'remove':'add']('accent');  /* 已就绪：下载按钮降为普通样式，不再暗示"还需要装" */
    /* 状态区可能在「本地模型」页，启停区在「转写」页：都按存在与否更新 */
    if(bar){
      if(dl.state==='downloading'){
        bar.style.display='block';bar.firstElementChild.style.width=((dl.progress||0)*100).toFixed(1)+'%';
      }else bar.style.display='none';
    }
    if(dt){
      if(dl.state==='downloading')dt.textContent='下载中 '+dl.file+' · '+fmtBytes(dl.got)+(dl.total?' / '+fmtBytes(dl.total):'');
      else dt.textContent=dl.state==='fail'?('下载失败：'+dl.error):(dl.state==='done'?'下载完成':'');
    }
    if(bd)bd.style.display=dl.state==='downloading'?'none':'';
    if(bs)bs.style.display=dl.state==='downloading'?'':'none';
    var srv=m.server,sb=document.getElementById('btnSrv'),sh=document.getElementById('llamaSrvHint');
    if(sb){
      sb.disabled=false;
      if(srv.healthy){sb.textContent='停止';sb.dataset.stop='1';}
      else if(srv.running){sb.textContent='停止';sb.dataset.stop='1';}
      else{sb.textContent='启动';delete sb.dataset.stop;}
    }
    if(sh){
      if(srv.healthy)sh.innerHTML='<span style="color:var(--ok)">运行中</span> · 端口 '+srv.port;
      else if(srv.running)sh.innerHTML='进程存在 · 端口 '+srv.port+'（模型加载中）';
      else sh.innerHTML='未运行';
    }
    /* GGUF 清单并入「管理模型」统一列表；这里只更新缓存目录显示 */
    MGR.asr=m;
    renderManage();
    if(m.download.state==='downloading')scheduleModelPoll();
  }).catch(function(){});
}
/* Whisper 模型管理：列表/安装/卸载（快照缓存），下载中每 2 秒刷新状态 */
/* Whisper 模型简介：帮用户判断该装哪个（配合大小提示一起看） */
var WH_DESC={tiny:'最快 · 显存/内存占用最低 · 适合先跑通流程',
  base:'轻量 · 速度与准确率偏速度',
  small:'均衡 · 推荐默认',
  medium:'更准 · 速度明显变慢',
  'large-v2':'高准确率 · 资源要求高',
  'large-v3':'最新 · 准确率最高 · 资源要求高'};
/* Whisper 模型管理：未装的进「获取模型」列；已装的进「管理模型」统一清单。
   下载中每 2 秒刷新状态 */
function loadWhisperModels(){
  api('/models/whisper').then(function(d){
    var getBox=document.getElementById('whGet');
    if(!getBox)return;
    MGR.wh=d.models;
    MGR.whCache=d.cache;
    var dl=d.download,dt=document.getElementById('whDlTxt');
    if(dl.state==='downloading')dt.textContent='正在下载 '+dl.name+' …（视网络可能需要几分钟，可离开本页）';
    else dt.textContent=dl.state==='fail'?('下载失败：'+dl.error):(dl.state==='done'?'下载完成':'');
    var get='';
    d.models.forEach(function(m){
      if(m.installed)return;
      var desc=WH_DESC[m.name]?' · '+WH_DESC[m.name]:'';
      get+='<div class="srow"><div><div class="lb">'+esc(m.name)+'</div>'+
        '<div class="hint">未下载'+(m.size_hint?' · '+esc(m.size_hint):'')+desc+'</div></div>'+
        '<div class="rt"><button class="btn sm accent" data-whdl="'+esc(m.name)+'">下载</button></div></div>';
    });
    getBox.innerHTML=get||'<div class="hint">Whisper 各模型都已下载</div>';
    getBox.querySelectorAll('[data-whdl]').forEach(function(x){
      x.onclick=function(){
        api('/models/whisper/download',{method:'POST',body:{name:x.dataset.whdl}})
          .then(function(r){toast(r.note||'开始下载（走 hf-mirror 镜像）');loadWhisperModels();})
          .catch(function(e){toast(e.message);});
      };
    });
    renderManage();
    if(dl.state==='downloading')scheduleModelPoll();
  }).catch(function(){});
}
/* 管理列：已装模型统一清单（Whisper + Qwen3 + 云端 API），点「使用」即切换转写引擎，
   被使用引擎的参数就地显示在下方「当前引擎配置」 */
var MGR={wh:null,asr:null,whCache:''};
function useEngine(engineId,model){
  var p={default_engine:engineId};
  if(model)p.whisper_model=model;
  api('/settings',{method:'PATCH',body:p}).then(function(){
    setForm.default_engine=engineId;
    if(model)setForm.whisper_model=model;
    toast(model?('已切换到 Whisper · '+model):'已切换默认引擎');
    renderSet();   // 「当前引擎配置」随切换重排；尾部加载器会刷新清单
  }).catch(function(e){toast(e.message);});
}
function renderManage(){
  var box=document.getElementById('modelManage');if(!box)return;
  var h='';
  var actW=setForm.default_engine==='whisper-local'?setForm.whisper_model:null;
  (MGR.wh||[]).forEach(function(m){
    if(!m.installed)return;
    var act=actW===m.name;
    h+='<div class="srow"><div><div class="lb">'+esc(m.name)+(act?' <span style="color:var(--ok)">· 当前使用</span>':'')+'</div>'+
      '<div class="hint">Whisper · 已下载 · '+fmtBytes(m.bytes)+(WH_DESC[m.name]?' · '+WH_DESC[m.name]:'')+'</div></div>'+
      '<div class="rt">'+(act?'':'<button class="btn sm" data-usewh="'+esc(m.name)+'">使用</button>')+
      '<button class="btn sm danger" data-whdel="'+esc(m.name)+'">卸载</button></div></div>';
  });
  if(MGR.asr){
    var mb=MGR.asr.model,qAct=setForm.default_engine==='llama-local';
    var qdesc=mb.ready?('主模型 '+fmtBytes(mb.main_bytes)+' · 编码器 '+fmtBytes(mb.mmproj_bytes)+' · 无 GPU 也能跑')
      :('不完整（已有 '+([mb.main?'主模型':null,mb.mmproj?'编码器':null].filter(Boolean).join(' + ')||'无文件')+'，暂不可用）');
    h+='<div class="srow"><div><div class="lb">Qwen3-ASR-1.7B（llama.cpp）'+(mb.ready&&qAct?' <span style="color:var(--ok)">· 当前使用</span>':'')+'</div>'+
      '<div class="hint">'+qdesc+'</div></div>'+
      '<div class="rt">'+(mb.ready&&!qAct?'<button class="btn sm" data-useqwen="1">使用</button>':'')+
      ((mb.main||mb.mmproj)?'<button class="btn sm danger" data-qwendel="1">卸载</button>':'')+'</div></div>';
  }
  var cAct=setForm.default_engine==='cloud-openai';
  h+='<div class="srow"><div><div class="lb">云端 API（OpenAI 兼容）'+(cAct?' <span style="color:var(--ok)">· 当前使用</span>':'')+'</div>'+
    '<div class="hint">'+esc(engDesc('cloud-openai'))+((setS&&setS.cloud_asr_ready)?' · Key 已配置':' · 未配置 Key')+'</div></div>'+
    '<div class="rt">'+(cAct?'':'<button class="btn sm" data-usecloud="1">使用</button>')+'</div></div>';
  box.innerHTML=h;
  box.querySelectorAll('[data-usewh]').forEach(function(x){
    x.onclick=function(){useEngine('whisper-local',x.dataset.usewh);};
  });
  box.querySelectorAll('[data-useqwen]').forEach(function(x){
    x.onclick=function(){useEngine('llama-local');};
  });
  box.querySelectorAll('[data-usecloud]').forEach(function(x){
    x.onclick=function(){useEngine('cloud-openai');};
  });
  box.querySelectorAll('[data-whdel]').forEach(function(x){
    x.onclick=function(){
      if(!confirm('卸载 '+x.dataset.whdel+'？将删除缓存目录，不可恢复。'))return;
      api('/models/whisper/'+x.dataset.whdel,{method:'DELETE'})
        .then(function(){toast('已卸载');loadWhisperModels();})
        .catch(function(e){toast(e.message);});
    };
  });
  var qd=box.querySelector('[data-qwendel]');
  if(qd)qd.onclick=function(){
    if(!confirm('卸载 Qwen3-ASR？将删除模型目录下的全部 GGUF 文件。'))return;
    var files=(MGR.asr&&MGR.asr.files)||[];
    var chain=Promise.resolve();
    files.forEach(function(f){
      chain=chain.then(function(){
        return api('/models/asr/file',{method:'DELETE',body:{name:f.name}})
          .catch(function(e){toast(e.message);});
      });
    });
    chain.then(function(){toast('已卸载');loadModel();});
  };
  var wc=document.getElementById('mgrWhCache'),qd2=document.getElementById('mgrQwenDir');
  if(wc)wc.textContent=MGR.whCache||'–';
  if(qd2&&MGR.asr&&MGR.asr.model)qd2.textContent=MGR.asr.model.dir;
}
var modelPoll=null;
function scheduleModelPoll(){
  clearTimeout(modelPoll);
  modelPoll=setTimeout(function(){
    if(cur!=='set'||setTab!=='stt')return;
    loadWhisperModels();loadModel();
  },2000);
}
document.getElementById('btnSave').onclick=function(){
  var p={};
  ['default_engine','whisper_model','whisper_device','whisper_language','ai_base','ai_model',
   'cloud_asr_base','cloud_asr_model','llama_server_path','llama_port','llama_repo','hf_mirror',
   'disabled_engines'].forEach(function(k){
    if(typeof setForm[k]==='string')p[k]=setForm[k];
  });
  ['cloud_asr_key','ai_key'].forEach(function(k){
    if(typeof setForm[k]==='string'&&setForm[k]&&!/^•+$/.test(setForm[k]))p[k]=setForm[k];
  });
  if(typeof setForm.auto_transcribe==='boolean')p.auto_transcribe=setForm.auto_transcribe;
  api('/settings',{method:'PATCH',body:p}).then(function(){toast('已保存');loadStats();loadSettings();})
    .catch(function(e){toast(e.message)});
};

document.getElementById('btnRefresh').onclick=function(){
  loadStats();
  if(cur==='asr')loadAsr();
  if(cur==='lib')loadList();
};

/* 启动：先拿引擎清单（设置页/引擎名映射要用），再按 URL 进入页面（缺省 #/home） */
api('/engines').then(function(r){engines=r.engines;if(cur==='set')renderSet();}).catch(function(){});
loadStats();
routeFromHash();
setInterval(function(){loadStats();if(cur==='asr')loadAsr();if(cur==='set')loadModel();},3000);
</script>
